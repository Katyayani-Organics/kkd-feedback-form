<!doctype html><html id="html" lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback · Katyayani Organics</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(135deg,#ecfdf5,#f0fdfa);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:#1f2937}
  .card{width:100%;max-width:480px;background:#fff;border:1px solid #d1fae5;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:24px}
  h1{font-size:20px;margin:0 0 6px} p.sub{margin:0 0 18px;color:#6b7280;font-size:14px}
  label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px} .opt{color:#9ca3af;font-weight:400}
  select,textarea{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
  textarea{min-height:120px;resize:vertical}
  button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#059669;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6} .err{color:#dc2626;font-size:14px;margin-top:10px;display:none}
  .center{text-align:center;padding:14px 0} .big{font-size:46px}
</style></head><body><div class="card" id="root"></div>
<script>
  var SUPA="https://gusenrddxwuwrclzfkur.supabase.co", ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1c2VucmRkeHd1d3JjbHpma3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1OTEwMDUsImV4cCI6MjA4NTE2NzAwNX0.wUW5lK3u9OtQTRoCqng_oWkRFk7eo-Cok1XxEZ3TZzQ";
  var p=new URLSearchParams(location.search);
  var chatId=p.get("chat")||"";
  var lang=(p.get("lang")||"hi").toLowerCase()==="en"?"en":"hi";
  var CATVAL=["Order / Delivery","Product / Quality","Payment / Refund","Support / Agent","Other"];
  var T={
    hi:{t:"🙏 अपना फ़ीडबैक दें",s:"आपकी राय हमारे लिए ज़रूरी है। कृपया नीचे बताएं।",catL:"किस बारे में है?",opt:"(वैकल्पिक)",catPh:"एक विकल्प चुनें",
        cats:["ऑर्डर / डिलीवरी","प्रोडक्ट / गुणवत्ता","पेमेंट / रिफंड","सपोर्ट / एजेंट","अन्य"],cmtL:"आपका फ़ीडबैक",cmtPh:"यहाँ लिखें… (ज़रूरी नहीं)",
        btn:"फ़ीडबैक भेजें",sending:"भेजा जा रहा है…",need:"कृपया कोई विकल्प चुनें या कुछ लिखें।",bad:"लिंक सही नहीं है।",fail:"नहीं भेजा जा सका, कृपया फिर कोशिश करें।",th:"धन्यवाद!",ths:"आपका फ़ीडबैक मिल गया है। 🙏"},
    en:{t:"🙏 Share your feedback",s:"Your feedback matters to us. Please tell us below.",catL:"What is it about?",opt:"(optional)",catPh:"Select an option",
        cats:["Order / Delivery","Product / Quality","Payment / Refund","Support / Agent","Other"],cmtL:"Your feedback",cmtPh:"Write here… (optional)",
        btn:"Send feedback",sending:"Sending…",need:"Please select an option or write something.",bad:"Invalid link.",fail:"Could not send, please try again.",th:"Thank you!",ths:"We've received your feedback. 🙏"}
  }[lang];
  document.getElementById("html").lang=lang;
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function render(){
    var opts='<option value="">'+T.catPh+'</option>'+CATVAL.map(function(v,i){return '<option value="'+esc(v)+'">'+esc(T.cats[i])+'</option>';}).join("");
    document.getElementById("root").innerHTML=
      '<h1>'+T.t+'</h1><p class="sub">'+T.s+'</p>'+
      '<label>'+T.catL+' <span class="opt">'+T.opt+'</span></label>'+
      '<select id="cat">'+opts+'</select>'+
      '<label>'+T.cmtL+' <span class="opt">'+T.opt+'</span></label>'+
      '<textarea id="cmt" placeholder="'+T.cmtPh+'"></textarea>'+
      '<div class="err" id="err"></div>'+
      '<button id="btn" onclick="submitFb()">'+T.btn+'</button>';
  }
  function show(h){document.getElementById("root").innerHTML=h;}
  async function submitFb(){
    var err=document.getElementById("err"),btn=document.getElementById("btn");
    var category=document.getElementById("cat").value,comment=document.getElementById("cmt").value.trim();
    err.style.display="none";
    if(!comment&&!category){err.textContent=T.need;err.style.display="block";return;}
    if(!chatId){err.textContent=T.bad;err.style.display="block";return;}
    btn.disabled=true;btn.textContent=T.sending;
    try{
      var r=await fetch(SUPA+"/functions/v1/chat-feedback/"+chatId,{method:"POST",headers:{"Content-Type":"application/json","apikey":ANON,"Authorization":"Bearer "+ANON},body:JSON.stringify({category:category,comment:comment})});
      var d=await r.json();
      if(r.ok&&(d.ok||d.submitted)){show('<div class="center"><div class="big">✅</div><h1>'+T.th+'</h1><p class="sub">'+T.ths+'</p></div>');}
      else{err.textContent=(d&&d.error)||T.fail;err.style.display="block";btn.disabled=false;btn.textContent=T.btn;}
    }catch(e){err.textContent=T.fail;err.style.display="block";btn.disabled=false;btn.textContent=T.btn;}
  }
  render();
</script></body></html>
